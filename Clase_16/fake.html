<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Login</title>
  <style>
    :root {
      --primary: #6C5CE7;
      --secondary: #A29BFE;
      --accent: #FD79A8;
      --dark: #2D3436;
      --light: #F5F6FA;
      --success: #00B894;
      --error: #D63031;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    
    .login-container:hover {
      transform: translateY(-5px);
    }
    
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 10px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    
    .login-container h1 {
      text-align: center;
      color: var(--dark);
      margin-bottom: 30px;
      font-size: 2.2rem;
      font-weight: 700;
      position: relative;
    }
    
    .login-container h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      margin: 10px auto;
      border-radius: 2px;
    }
    
    .input-group {
      position: relative;
      margin-bottom: 25px;
    }
    
    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    
    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background-color: var(--light);
    }
    
    .input-group input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
    }
    
    .input-group i {
      position: absolute;
      left: 15px;
      top: 40px;
      color: var(--primary);
      font-size: 1.1rem;
    }
    
    .login-container button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    }
    
    .login-container button:hover {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
    }
    
    .login-container button:active {
      transform: translateY(0);
    }
    
    .response {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }
    
    .response.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    .success {
      background-color: rgba(0, 184, 148, 0.1);
      color: var(--success);
      border: 1px solid rgba(0, 184, 148, 0.3);
    }
    
    .error {
      background-color: rgba(214, 48, 49, 0.1);
      color: var(--error);
      border: 1px solid rgba(214, 48, 49, 0.3);
    }
    
    .footer-text {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 0.85rem;
    }
    
    .footer-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }  

  </style>
</head>
<body>

  <div class="login-container">
    <h1>Bienvenido al Sistema</h1>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    <div class="response" id="response"></div>
    <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const responseDiv = document.getElementById('response');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      
      // Reset response
      responseDiv.className = 'response';
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        // Show loading state
        responseDiv.innerText = 'Authenticating...';
        responseDiv.classList.add('show');
        
        const res = await fetch('https://fakestoreapi.com/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (data.token) {
          responseDiv.innerText = 'Login successful! Redirecting...';
          responseDiv.classList.add('show', 'success');
          
          // Simulate redirect
          setTimeout(() => {
            window.location.href = 'https://www.ucsa.edu.py';
          }, 1500);
        } else {
          responseDiv.innerText = 'Invalid credentials. Please try again.';
          responseDiv.classList.add('show', 'error');
        }
      } catch (error) {
        responseDiv.innerText = 'Network error. Please try again later.';
        responseDiv.classList.add('show', 'error');
      }
    });
    
    // Add focus effects
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.querySelector('label').style.color = 'var(--primary)';
        this.parentElement.querySelector('i').style.color = 'var(--accent)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.querySelector('label').style.color = 'var(--dark)';
        this.parentElement.querySelector('i').style.color = 'var(--primary)';
      });
    });
  </script>

</body>
</html>
