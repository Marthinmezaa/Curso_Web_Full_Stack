<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con JWT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(125deg, #0b2b40, #1a4a5f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            width: 380px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        h2 {
            text-align: center;
            color: #0b2b40;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 60px;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #1a6d8a;
            box-shadow: 0 0 0 2px rgba(26,109,138,0.2);
        }
        button {
            width: 100%;
            background: #1f7a5a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0e5e44;
        }
        .error {
            background: #ffe5e5;
            color: #c0392b;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
        }
        .success-area {
            margin-top: 1.5rem;
            border-top: 2px solid #cfe3cf;
            padding-top: 1.2rem;
        }
        .token-info {
            background: #f0f5f8;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            word-break: break-all;
            font-family: monospace;
            margin: 15px 0;
        }
        .logout-btn {
            background: #c7452b;
            margin-top: 0.5rem;
        }
        .logout-btn:hover {
            background: #9a2d18;
        }
        .demo-users {
            font-size: 0.75rem;
            background: #eef2f3;
            padding: 10px;
            border-radius: 20px;
            margin-top: 1rem;
            text-align: center;
        }
        hr {
            margin: 15px 0;
        }
    </style>
    <!-- Librería jose para firmar/verificar JWT en el navegador -->
    <script type="importmap">
        {
            "imports": {
                "jose": "https://esm.sh/jose@5.9.6"
            }
        }
    </script>
    <script type="module">
        import { SignJWT, jwtVerify } from 'jose';

        // ----- CONFIGURACIÓN SIMULADA -----
        // Clave secreta para firmar tokens (en un caso real estaría en el servidor)
        const SECRET_KEY = new TextEncoder().encode("mi-clave-super-secreta-para-jwt-demo");
        
        // Usuarios y contraseñas fáciles (simulados)
        const USUARIOS_VALIDOS = [
            { user: "ana", pass: "123" },
            { user: "luis", pass: "clave" },
            { user: "admin", pass: "admin" }
        ];

        // Elementos del DOM
        const loginDiv = document.getElementById('login-section');
        const dashboardDiv = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const nombreSpan = document.getElementById('nombreUsuario');
        const tokenPre = document.getElementById('jwtToken');
        const logoutBtn = document.getElementById('logoutBtn');

        // Función para generar un JWT (expira en 1 hora)
        async function generarJWT(username) {
            const token = await new SignJWT({ 
                username: username,
                role: "user"
            })
            .setProtectedHeader({ alg: 'HS256', typ: 'JWT' })
            .setIssuedAt()
            .setExpirationTime('1h')
            .sign(SECRET_KEY);
            return token;
        }

        // Verificar si ya hay sesión activa al cargar la página
        async function verificarSesion() {
            const tokenGuardado = sessionStorage.getItem('jwt_token');
            if (!tokenGuardado) {
                mostrarLogin(true);
                return;
            }
            try {
                // Verificar que el token es válido (no expirado, firma correcta)
                const { payload } = await jwtVerify(tokenGuardado, SECRET_KEY);
                // Token válido: mostrar dashboard
                mostrarDashboard(payload.username);
            } catch (error) {
                // Token inválido o expirado
                sessionStorage.removeItem('jwt_token');
                mostrarLogin(true);
            }
        }

        // Mostrar login y ocultar dashboard
        function mostrarLogin(mostrar) {
            if (mostrar) {
                loginDiv.style.display = 'block';
                dashboardDiv.style.display = 'none';
                errorMsg.style.display = 'none';
            } else {
                loginDiv.style.display = 'none';
                dashboardDiv.style.display = 'block';
            }
        }

        // Mostrar panel de bienvenida con el nombre y el JWT
        function mostrarDashboard(username) {
            mostrarLogin(false);
            nombreSpan.textContent = username;
            const token = sessionStorage.getItem('jwt_token');
            tokenPre.textContent = token || "No disponible";
        }

        // Procesar el login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorMsg.textContent = "❌ Completa usuario y contraseña.";
                errorMsg.style.display = 'block';
                return;
            }

            // Buscar usuario en la lista simulada
            const usuarioValido = USUARIOS_VALIDOS.find(u => u.user === username && u.pass === password);
            if (!usuarioValido) {
                errorMsg.textContent = "❌ Usuario o contraseña incorrectos. Prueba con ana/123, luis/clave o admin/admin";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                // Generar JWT firmado
                const token = await generarJWT(username);
                // Guardar token en sessionStorage (simula sesión)
                sessionStorage.setItem('jwt_token', token);
                mostrarDashboard(username);
            } catch (err) {
                errorMsg.textContent = "Error al generar token JWT.";
                errorMsg.style.display = 'block';
                console.error(err);
            }
        });

        // Cerrar sesión: eliminar token y volver al login
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('jwt_token');
            mostrarLogin(true);
            loginForm.reset();
        });

        // Iniciar: comprobar si ya existe sesión
        verificarSesion();
    </script>
</head>
<body>
<div class="card">
    <!-- Sección de login -->
    <div id="login-section">
        <h2>🔐 Acceso con JWT</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" autocomplete="off" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar sesión</button>
            <div id="errorMsg" class="error" style="display: none;"></div>
        </form>
        <div class="demo-users">
            📌 Usuarios de prueba:<br>
            <strong>ana</strong> / 123 &nbsp;|&nbsp;
            <strong>luis</strong> / clave &nbsp;|&nbsp;
            <strong>admin</strong> / admin
        </div>
        <div style="font-size: 0.7rem; text-align: center; margin-top: 12px;">
            ⚡ JWT firmado localmente con HS256 (demo)
        </div>
    </div>

    <!-- Panel de bienvenida (se muestra después del login) -->
    <div id="dashboard-section" style="display: none;">
        <h2>✨ ¡Bienvenido! ✨</h2>
        <p style="text-align: center; font-size: 1.2rem;">
            Hola, <strong id="nombreUsuario"></strong>
        </p>
        <div class="success-area">
            <p style="font-weight: bold;">✅ Sesión iniciada con JWT</p>
            <div class="token-info">
                <strong>🪙 Token JWT activo:</strong><br>
                <span id="jwtToken" style="font-size: 0.65rem;"></span>
            </div>
            <button id="logoutBtn" class="logout-btn">🚪 Cerrar sesión</button>
        </div>
        <hr>
        <div style="font-size: 0.7rem; text-align: center; color: #2c6e5c;">
            El token expira en 1 hora. Se guarda en sessionStorage.
        </div>
    </div>
</div>
</body>
</html>
