<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Población de Sudamérica</title>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #f0f8ff, #e0eafc);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 700px;
        margin: auto;
        padding: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      #chart_div {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Población de Países Sudamericanos</h1>
      <p>
        Este gráfico muestra la población de cada país de Sudamérica basado en
        datos de la API REST Countries.
      </p>
      <div id="chart_div"></div>
    </div>

    <script>
      // Cargar la biblioteca de visualización de Google Charts
      google.charts.load("current", { packages: ["corechart"] });

      // Llamada a la API y generación del gráfico
      async function fetchAndDrawChart() {
        try {
          // Fetch de la API
          const response = await fetch(
            "https://restcountries.com/v3.1/subregion/South%20America",
          );
          const countries = await response.json();

          // Crear estructura de datos para Google Charts
          const data = new google.visualization.DataTable();
          data.addColumn("string", "País");
          data.addColumn("number", "Población");

          countries.forEach((country) => {
            data.addRow([country.name.common, country.population]);
          });

          // Opciones del gráfico
          const options = {
            title: "Población de los Países Sudamericanos",
            width: 700,
            height: 400,
            backgroundColor: "#f9f9f9",
            chartArea: { width: "70%", height: "70%" },
            hAxis: {
              title: "Países",
              slantedText: true,
              slantedTextAngle: 45,
            },
            vAxis: { title: "Población", format: "short" },
            legend: { position: "none" },
          };

          // Dibujar el gráfico
          const chart = new google.visualization.PieChart(
            document.getElementById("chart_div"),
          );
          chart.draw(data, options);
        } catch (error) {
          console.error("Error al obtener datos de la API:", error);
          alert("No se pudo cargar los datos. Intenta más tarde.");
        }
      }

      // Cargar Google Charts y luego dibujar
      google.charts.setOnLoadCallback(fetchAndDrawChart);
    </script>
  </body>
</html>
