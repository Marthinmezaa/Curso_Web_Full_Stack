<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario del Estudiante</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      fieldset {
        border: 2px solid #ddd;
        border-radius: 5px;
        padding: 15px;
        margin-bottom: 20px;
      }
      legend {
        font-weight: bold;
        padding: 0 10px;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      input[type="text"],
      input[type="date"],
      input[type="email"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
      }
      input[type="submit"] {
        background-color: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      input[type="submit"]:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <h1>Formulario de Práctica</h1>

    <form action="#" method="post">
      <!-- Primer fieldset para información personal -->
      <fieldset>
        <legend>Información de la Persona</legend>

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input
          type="date"
          id="fecha_nacimiento"
          name="fecha_nacimiento"
          required
        />
      </fieldset>

      <!-- Segundo fieldset para información de contacto -->
      <fieldset>
        <legend>Información Basica de la Persona</legend>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="telefono">Teléfono (opcional):</label>
        <input type="text" id="telefono" name="telefono" />
      </fieldset>

      <input type="submit" value="Enviar Formulario" />
    </form>
  </body>
</html>
