<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuestionario de HTML5</title>
    <style>
      :root {
        --primary-color: #3498db;
        --secondary-color: #2ecc71;
        --accent-color: #9b59b6;
        --danger-color: #e74c3c;
        --light-color: #ecf0f1;
        --dark-color: #2c3e50;
        --shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: var(--dark-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        animation: fadeIn 0.8s ease;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
        padding: 20px;
        position: relative;
      }

      h1 {
        color: var(--primary-color);
        font-size: 2.8rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        position: relative;
        display: inline-block;
      }

      h1::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 4px;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--accent-color)
        );
        border-radius: 2px;
      }

      .subtitle {
        color: var(--dark-color);
        font-size: 1.2rem;
        opacity: 0.8;
        margin-top: 15px;
      }

      .question {
        background: white;
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 25px;
        margin: 20px 0;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        transform: translateY(20px);
        opacity: 0;
        animation: slideUp 0.5s forwards;
      }

      .question:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      }

      .question-number {
        position: absolute;
        top: 0;
        right: 0;
        background: var(--primary-color);
        color: white;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom-left-radius: 12px;
        font-weight: bold;
        font-size: 1.1rem;
      }

      .question p {
        font-weight: 600;
        color: var(--dark-color);
        font-size: 1.2rem;
        margin-bottom: 20px;
        padding-right: 50px;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .option-btn {
        padding: 15px 20px;
        font-size: 1rem;
        cursor: pointer;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        background-color: white;
        color: var(--dark-color);
        transition: var(--transition);
        text-align: left;
        position: relative;
        overflow: hidden;
      }

      .option-btn:hover {
        border-color: var(--primary-color);
        background-color: rgba(52, 152, 219, 0.05);
        transform: translateX(5px);
      }

      .option-btn:disabled {
        cursor: not-allowed;
      }

      .option-btn.correct {
        background-color: rgba(46, 204, 113, 0.15);
        border-color: var(--secondary-color);
        color: var(--dark-color);
      }

      .option-btn.wrong {
        background-color: rgba(231, 76, 60, 0.15);
        border-color: var(--danger-color);
        color: var(--dark-color);
      }

      .option-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #e0e0e0;
        transition: var(--transition);
      }

      .option-btn.correct::after {
        background-color: var(--secondary-color);
      }

      .option-btn.wrong::after {
        background-color: var(--danger-color);
      }

      #result {
        text-align: center;
        margin-top: 30px;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: var(--shadow);
        font-size: 1.4rem;
        color: var(--dark-color);
        display: none;
        animation: popIn 0.5s ease;
      }

      .result-score {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 15px 0;
        color: var(--primary-color);
      }

      .result-message {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }

      .restart-btn {
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--accent-color)
        );
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 1rem;
        border-radius: 50px;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
      }

      .restart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
      }

      .progress-container {
        width: 100%;
        background-color: #e0e0e0;
        border-radius: 10px;
        margin: 20px 0;
        overflow: hidden;
        height: 10px;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--accent-color)
        );
        width: 0%;
        transition: width 0.5s ease;
      }

      footer {
        margin-top: 40px;
        text-align: center;
        color: var(--dark-color);
        opacity: 0.7;
        font-size: 0.9rem;
      }

      .loading {
        text-align: center;
        padding: 40px;
        font-size: 1.2rem;
        color: var(--primary-color);
      }

      .error {
        text-align: center;
        padding: 40px;
        background-color: rgba(231, 76, 60, 0.1);
        border-radius: 12px;
        color: var(--danger-color);
        margin: 20px 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes popIn {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        70% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.2rem;
        }

        .question {
          padding: 20px;
        }

        .option-btn {
          padding: 12px 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Cuestionario de HTML5</h1>
        <p class="subtitle">Pon a prueba tus conocimientos sobre HTML5</p>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </header>

      <div id="questions-container">
        <div class="loading" id="loading-message">Cargando preguntas...</div>
      </div>

      <div id="result">
        <h2>¡Cuestionario Completado!</h2>
        <div class="result-score" id="score">0/0</div>
        <p class="result-message" id="result-message"></p>
        <button class="restart-btn" onclick="restartQuiz()">
          Reiniciar Cuestionario
        </button>
      </div>

      <footer>
        <p>Cuestionario interactivo de HTML5 - Diseñado con ❤️</p>
      </footer>
    </div>

    <script>
      let correctAnswers = 0;
      let totalQuestions = 0;
      let currentQuestionIndex = 0;
      let questions = [];

      // Función para cargar las preguntas desde el archivo JSON
      async function loadQuestionsFromJSON() {
        try {
          const response = await fetch("preguntas.json");
          if (!response.ok) {
            throw new Error(`Error al cargar preguntas: ${response.status}`);
          }
          questions = await response.json();
          return questions;
        } catch (error) {
          console.error("Error al cargar las preguntas:", error);
          throw error;
        }
      }

      function checkAnswer(questionId, button, isCorrect) {
        const buttons = document.querySelectorAll(`#${questionId} .option-btn`);
        buttons.forEach((btn) => {
          btn.disabled = true;
        });

        if (isCorrect) {
          button.classList.add("correct");
          correctAnswers++;
        } else {
          button.classList.add("wrong");
        }

        currentQuestionIndex++;
        updateProgress();

        // Esperar un momento antes de pasar a la siguiente pregunta
        setTimeout(() => {
          if (currentQuestionIndex < totalQuestions) {
            showNextQuestion();
          } else {
            showResult();
          }
        }, 1000);
      }

      function showNextQuestion() {
        const questions = document.querySelectorAll(".question");
        questions[currentQuestionIndex].scrollIntoView({
          behavior: "smooth",
          block: "center",
        });
      }

      function updateProgress() {
        const progressBar = document.getElementById("progress-bar");
        const progress = (currentQuestionIndex / totalQuestions) * 100;
        progressBar.style.width = `${progress}%`;
      }

      function showResult() {
        const resultDiv = document.getElementById("result");
        const scoreElement = document.getElementById("score");
        const messageElement = document.getElementById("result-message");

        scoreElement.textContent = `${correctAnswers}/${totalQuestions}`;

        let message = "";
        if (correctAnswers === totalQuestions) {
          message = "¡Excelente! Eres un experto en HTML5.";
        } else if (correctAnswers >= totalQuestions * 0.7) {
          message = "¡Muy bien! Tienes un buen conocimiento de HTML5.";
        } else if (correctAnswers >= totalQuestions * 0.5) {
          message = "No está mal, pero hay espacio para mejorar.";
        } else {
          message = "Puedes mejorar. Sigue practicando HTML5.";
        }

        messageElement.textContent = message;
        resultDiv.style.display = "block";
        resultDiv.scrollIntoView({ behavior: "smooth" });
      }

      function restartQuiz() {
        correctAnswers = 0;
        currentQuestionIndex = 0;

        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "none";

        const progressBar = document.getElementById("progress-bar");
        progressBar.style.width = "0%";

        loadQuestions();
      }

      function displayQuestions() {
        const container = document.getElementById("questions-container");
        totalQuestions = questions.length;

        questions.forEach((question, index) => {
          const questionDiv = document.createElement("div");
          questionDiv.className = "question";
          questionDiv.id = question.id;
          questionDiv.style.animationDelay = `${index * 0.1}s`;

          const questionNumber = document.createElement("div");
          questionNumber.className = "question-number";
          questionNumber.textContent = index + 1;
          questionDiv.appendChild(questionNumber);

          const questionText = document.createElement("p");
          questionText.textContent = question.pregunta;
          questionDiv.appendChild(questionText);

          const optionsDiv = document.createElement("div");
          optionsDiv.className = "options";

          question.opciones.forEach((option) => {
            const button = document.createElement("button");
            button.className = "option-btn";
            button.textContent = option.texto;
            button.onclick = () =>
              checkAnswer(question.id, button, option.correcta);
            optionsDiv.appendChild(button);
          });

          questionDiv.appendChild(optionsDiv);
          container.appendChild(questionDiv);
        });
      }

      async function loadQuestions() {
        try {
          await loadQuestionsFromJSON();
          const loadingMessage = document.getElementById("loading-message");
          if (loadingMessage) {
            loadingMessage.remove();
          }
          displayQuestions();
        } catch (error) {
          const container = document.getElementById("questions-container");
          container.innerHTML = `
                    <div class="error">
                        <h3>Error al cargar las preguntas</h3>
                        <p>No se pudieron cargar las preguntas del cuestionario.</p>
                        <p>Por favor, verifica que el archivo "preguntas.json" exista y tenga el formato correcto.</p>
                        <button class="restart-btn" onclick="loadQuestions()">Reintentar</button>
                    </div>
                `;
          console.error("Error al cargar las preguntas:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", loadQuestions);
    </script>
  </body>
</html>
