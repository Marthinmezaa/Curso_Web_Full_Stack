<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="stylesheet"
href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.min.css">

<link rel="stylesheet"
href="https://cdn.datatables.net/columncontrol/1.2.1/css/columnControl.dataTables.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js"></script>

<script src="https://cdn.datatables.net/columncontrol/1.2.1/js/dataTables.columnControl.min.js"></script>

</head>

<body>

<table id="example" class="display">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Cargo</th>
            <th>Ciudad</th>
            <th>Edad</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Juan Pérez</td>
            <td>Developer</td>
            <td>Asunción</td>
            <td>28</td>
        </tr>

        <tr>
            <td>María Gómez</td>
            <td>QA Engineer</td>
            <td>Encarnación</td>
            <td>31</td>
        </tr>

        <tr>
            <td>Pedro Rojas</td>
            <td>DevOps</td>
            <td>San Lorenzo</td>
            <td>29</td>
        </tr>
    </tbody>
</table>

<script>

new DataTable('#example', {

    columnControl: [
        'order',
        [
            'search',
            'spacer',
            'orderAsc',
            'orderDesc',
            'orderClear'
        ]
    ],

    ordering: {
        indicators: false
    },
    language: {
          "url": "https://cdn.datatables.net/plug-ins/2.3.8/i18n/es-ES.json"
        }
});

</script>

</body>
</html>
