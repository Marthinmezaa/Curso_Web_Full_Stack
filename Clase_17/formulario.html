<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWA - Enviar mensaje (versión simple)</title>
    <style>
        /* Estilos mínimos y claros para novatos */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 1.8rem;
            border: 1px solid #ddd;
        }
        h2 {
            margin-top: 0;
            color: #0a2b3e;
            font-weight: 600;
            font-size: 1.6rem;
            border-left: 5px solid #0f172a;
            padding-left: 1rem;
        }
        .info-fija {
            background: #eef2ff;
            padding: 0.7rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            font-family: monospace;
            color: #1e293b;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
            color: #0f172a;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            width: 100%;
            margin-top: 1.8rem;
            cursor: pointer;
            transition: 0.15s;
        }
        button:hover {
            background: #1e293b;
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .respuesta {
            margin-top: 1.5rem;
            background: #f8fafc;
            border-radius: 16px;
            padding: 1rem;
            font-size: 0.9rem;
            border-left: 5px solid #94a3b8;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .exito {
            background: #e6f7e6;
            border-left-color: #2e7d32;
            color: #1e4620;
        }
        .error {
            background: #ffe6e6;
            border-left-color: #c62828;
            color: #b71c1c;
        }
        .cargando {
            background: #fff3e0;
            border-left-color: #f39c12;
        }
        small {
            display: block;
            margin-top: 0.25rem;
            font-size: 0.7rem;
            color: #5b6e8c;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📲 Enviar mensaje con OpenWA</h2>

    <!-- Datos fijos que NO necesita modificar el alumno -->
    <div class="info-fija">
        🔐 Sesión ID: <strong>1ff21391-ddbb-48b1-9660-9daa39fbce48</strong><br>
        🗝️ API Key: <strong>dev-admin-key</strong><br>
        🌐 Servidor: <strong>http://localhost:2785</strong>
    </div>

    <!-- Solo dos campos para el estudiante -->
    <label>📞 Chat ID (número con @c.us)</label>
    <input type="text" id="chatId" placeholder="Ejemplo: 521234567890@c.us" value="573123456789@c.us">
    <small>Formato: código país + número + @c.us (ej: 34612345678@c.us)</small>

    <label>💬 Mensaje de texto</label>
    <textarea id="mensaje" placeholder="Escribe tu mensaje aquí...">Hola desde OpenWA 🚀</textarea>

    <button id="btnEnviar">📨 Enviar mensaje</button>

    <div id="resultado" class="respuesta">
        ✅ Listo. Escribe un número y haz clic en Enviar.
    </div>
</div>

<script>
    // ============================================================
    // DATOS FIJOS (hardcodeados para que el alumno no los toque)
    // ============================================================
    const SESSION_ID = "1ff21391-ddbb-48b1-9660-9daa39fbce48";
    const API_KEY = "dev-admin-key";
    const BASE_URL = "http://localhost:2785";   // servidor de OpenWA

    // Construimos el endpoint completo una sola vez
    const ENDPOINT = `${BASE_URL}/api/sessions/${SESSION_ID}/messages/send-text`;

    // Referencias a elementos del DOM
    const chatIdInput = document.getElementById('chatId');
    const mensajeInput = document.getElementById('mensaje');
    const btn = document.getElementById('btnEnviar');
    const resultadoDiv = document.getElementById('resultado');

    // Función para mostrar mensajes en el panel de resultado
    function mostrarRespuesta(tipo, texto, detalle = '') {
        // Limpiamos clases previas
        resultadoDiv.classList.remove('exito', 'error', 'cargando');
        if (tipo === 'exito') {
            resultadoDiv.classList.add('exito');
            resultadoDiv.innerHTML = `<strong>✅ ¡Enviado correctamente!</strong><br>${texto}${detalle ? '<br>📎 ' + detalle : ''}`;
        } else if (tipo === 'error') {
            resultadoDiv.classList.add('error');
            resultadoDiv.innerHTML = `<strong>❌ Error</strong><br>${texto}${detalle ? '<br>🔍 ' + detalle : ''}`;
        } else if (tipo === 'cargando') {
            resultadoDiv.classList.add('cargando');
            resultadoDiv.innerHTML = `<strong>⏳ Enviando...</strong><br>${texto}`;
        } else {
            resultadoDiv.classList.remove('exito', 'error', 'cargando');
            resultadoDiv.innerHTML = texto;
        }
    }

    // Función que envía el mensaje a la API
    async function enviarMensaje() {
        // 1. Obtener valores del formulario
        const chatId = chatIdInput.value.trim();
        const texto = mensajeInput.value.trim();

        // 2. Validaciones sencillas
        if (!chatId) {
            mostrarRespuesta('error', 'Falta el Chat ID', 'Ejemplo: 521234567890@c.us');
            return;
        }
        if (!texto) {
            mostrarRespuesta('error', 'El mensaje está vacío', 'Escribe algo para enviar');
            return;
        }
        if (!chatId.includes('@c.us')) {
            mostrarRespuesta('error', 'Chat ID inválido', 'Debe terminar en @c.us (ej: 34612345678@c.us)');
            return;
        }

        // 3. Deshabilitar botón mientras se envía (evitar doble clic)
        btn.disabled = true;
        btn.innerText = '⏳ Enviando...';
        mostrarRespuesta('cargando', `Enviando a ${chatId} ...`);

        // 4. Preparar el cuerpo de la petición (JSON)
        const payload = {
            chatId: chatId,
            text: texto
        };

        try {
            // 5. Realizar la llamada POST con fetch
            const respuestaHttp = await fetch(ENDPOINT, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            // 6. Leer la respuesta (puede ser JSON o texto plano)
            let datosRespuesta = null;
            let textoRespuesta = '';
            const contentType = respuestaHttp.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                try {
                    datosRespuesta = await respuestaHttp.json();
                    textoRespuesta = JSON.stringify(datosRespuesta, null, 2);
                } catch (e) {
                    textoRespuesta = await respuestaHttp.text();
                }
            } else {
                textoRespuesta = await respuestaHttp.text();
            }

            // 7. Verificar si la petición fue exitosa (código 2xx, idealmente 201)
            if (respuestaHttp.ok) {
                let mensajeId = 'desconocido';
                let timestamp = '';
                if (datosRespuesta && datosRespuesta.messageId) {
                    mensajeId = datosRespuesta.messageId;
                }
                if (datosRespuesta && datosRespuesta.timestamp) {
                    const fecha = new Date(datosRespuesta.timestamp * 1000);
                    timestamp = ` | Hora: ${fecha.toLocaleTimeString()}`;
                }
                mostrarRespuesta('exito', 
                    `Mensaje entregado a ${chatId}`, 
                    `ID del mensaje: ${mensajeId}${timestamp}`
                );
            } else {
                // Errores HTTP (400, 404, 500...)
                let mensajeError = `HTTP ${respuestaHttp.status} ${respuestaHttp.statusText}`;
                let detalles = '';
                if (respuestaHttp.status === 400) detalles = 'Sesión inactiva o solicitud incorrecta. Verifica que OpenWA esté corriendo y la sesión activa.';
                else if (respuestaHttp.status === 404) detalles = 'Sesión no encontrada. Revisa que el Session ID sea correcto (está fijo en el código).';
                else detalles = textoRespuesta.substring(0, 180);
                mostrarRespuesta('error', mensajeError, detalles);
            }
        } catch (error) {
            // Error de red, CORS o servidor inaccesible
            let errorMsg = error.message || 'Error de conexión';
            let ayuda = '';
            if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
                ayuda = '❌ No se pudo contactar con OpenWA. ¿El servidor está ejecutándose en http://localhost:2785 ? Verifica que el puerto sea correcto.';
            } else {
                ayuda = 'Revisa la consola del navegador para más detalles. Posible problema de CORS o URL incorrecta.';
            }
            mostrarRespuesta('error', `🔌 ${errorMsg}`, ayuda);
        } finally {
            // Restaurar botón
            btn.disabled = false;
            btn.innerText = '📨 Enviar mensaje';
        }
    }

    // Asignar evento al botón
    btn.addEventListener('click', enviarMensaje);

    // (Opcional) Enviar con Ctrl+Enter dentro del textarea
    mensajeInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            enviarMensaje();
        }
    });
</script>
</body>
</html>
